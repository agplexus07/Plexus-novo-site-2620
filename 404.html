<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Agência Plexus</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
  <style>
    :root { --red: #FF2400; --ink: #1D1C21; --paper: #D7D7D5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh; display: grid; place-items: center; text-align: center;
      background: var(--ink); color: var(--paper);
      font-family: 'IBM Plex Mono', ui-monospace, monospace; padding: 24px;
    }
    main { display: grid; gap: 1.4rem; justify-items: center; max-width: 560px; }
    img { width: 56px; height: auto; }
    h1 { font-family: 'Special Gothic Expanded One', 'Arial Black', sans-serif; font-weight: 400; text-transform: uppercase; font-size: clamp(2.6rem, 12vw, 6rem); line-height: .9; color: var(--red); }
    p { opacity: .8; line-height: 1.6; }
    a { display: inline-block; margin-top: .6rem; padding: 1em 1.8em; border-radius: 999px; background: var(--red); color: var(--paper); text-decoration: none; font-weight: 500; }
    a:hover { background: var(--paper); color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/favicon.svg" alt="Símbolo da Agência Plexus">
    <h1>404</h1>
    <p>Essa página saiu do posicionamento. Mas a sua marca não precisa sair: volta pra home que a gente te mostra o caminho.</p>
    <a href="/">Voltar para o site</a>
  </main>
</body>
</html>
